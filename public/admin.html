<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Panel de administración</title>
</head>
<body>
  <h1>Sugerencias recibidas</h1>
  <div id="lista"></div>


<div id="Cafetería" style="display: none;">
  <h2>Estás administrando: Cafeteria</h2>

</div>

<div id="Biblioteca" style="display: none;">
  <h2>Estás administrando: Biblioteca</h2>

</div>



<script>
 
  const parametros = new URLSearchParams(window.location.search);
  const categoriaMarcada = parametros.get('categoria');

  
  if (categoriaMarcada === 'Cafetería') {
    document.getElementById('Cafetería').style.display = 'block';
  } else if (categoriaMarcada === 'Biblioteca') {
    document.getElementById('Biblioteca').style.display = 'block';
  } else {

    alert("Por favor, selecciona una categoría válida en el index.");
  }
</script>
  
  <script>
  async function cargarSugerencias() {
    try {
      const respuesta = await fetch('/api/sugerencias');
      const sugerencias = await respuesta.json();

      const contenedor = document.getElementById('lista');

  
      const parametros = new URLSearchParams(window.location.search);
      const categoriaMarcada = parametros.get('categoria');


      const sugerenciasFiltradas = sugerencias.filter(s =>
        s.categoria === categoriaMarcada
      );

   
      sugerenciasFiltradas.forEach(s => {
        const div = document.createElement('div');

        div.innerHTML = `
          <p><strong>Categoría:</strong> ${s.categoria}</p>
          <p><strong>Prioridad:</strong> ${s.Prioridad}</p>
          <p>${s.mensaje}</p>
          <small>${s.nombre || 'Anónimo'}</small>
          <hr>
        `;

        contenedor.appendChild(div);
      });

    
      if (sugerenciasFiltradas.length === 0) {
        contenedor.innerHTML = `
          <p>No hay sugerencias para la categoría ${categoriaMarcada}.</p>
        `;
      }

    } catch (error) {
      console.error('Error al cargar las sugerencias:', error);
    }
  }

  cargarSugerencias();
</script>

</body>
</html>
