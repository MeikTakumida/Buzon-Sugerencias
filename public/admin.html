<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Panel de administración</title>
</head>

<body>

  <h1>Sugerencias recibidas</h1>

  <!-- Panel de Cafetería -->
  <div id="Cafetería" style="display: none;">
    <h2>Estás administrando: Cafetería</h2>
    <div id="listaCafeteria"></div>
  </div>

  <!-- Panel de Biblioteca -->
  <div id="Biblioteca" style="display: none;">
    <h2>Estás administrando: Biblioteca</h2>
    <div id="listaBiblioteca"></div>
  </div>


  <script>
    const parametros = new URLSearchParams(window.location.search);
    const categoriaMarcada = parametros.get('categoria');


    // Mostrar solamente el panel correspondiente
    if (categoriaMarcada === 'Cafetería') {

      document.getElementById('Cafetería').style.display = 'block';

    } else if (categoriaMarcada === 'Biblioteca') {

      document.getElementById('Biblioteca').style.display = 'block';

    } else {

      // Si no se seleccionó ninguna categoría
      document.body.innerHTML += `
        <p>No se ha seleccionado ninguna categoría.</p>
      `;
    }


    // Cargar las sugerencias
    async function cargarSugerencias() {

      const respuesta = await fetch('/api/sugerencias');
      const sugerencias = await respuesta.json();


      // Filtrar las sugerencias según la categoría seleccionada
      const sugerenciasFiltradas = sugerencias.filter(s =>
        s.categoria === categoriaMarcada
      );


      // Elegir dónde mostrar las sugerencias
      let contenedor;

      if (categoriaMarcada === 'Cafetería') {
        contenedor = document.getElementById('listaCafeteria');

      } else if (categoriaMarcada === 'Biblioteca') {
        contenedor = document.getElementById('listaBiblioteca');

      } else {
        return;
      }


      // Mostrar solamente las sugerencias de esa categoría
      sugerenciasFiltradas.forEach(s => {

        const div = document.createElement('div');

        div.innerHTML = `
          <hr>
          <p><strong>Prioridad:</strong> ${s.Prioridad}</p>
          <p>${s.mensaje}</p>
          <small>${s.nombre || 'Anónimo'}</small>
        `;

        contenedor.appendChild(div);
      });


      // Si no hay sugerencias
      if (sugerenciasFiltradas.length === 0) {

        contenedor.innerHTML = `
          <p>No hay sugerencias para esta categoría.</p>
        `;
      }
    }


    cargarSugerencias();

  </script>

</body>
</html>
